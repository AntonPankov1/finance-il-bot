<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кредитный Калькулятор</title>
    <!-- Подключаем библиотеку Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Используем системные цвета Telegram для идеальной интеграции */
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: var(--tg-theme-text-color, #000);
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999);
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="number"], input[type="range"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        .slider-value {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999);
            margin-top: 5px;
        }
        .results {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            text-align: center;
        }
        .results h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            font-weight: normal;
        }
        .main-result {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .details {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 15px;
        }
        .details div {
            flex: 1;
        }
    </style>
</head>
<body>

    <h2>Кредитный калькулятор</h2>
    <div class="subtitle">Израильский стандарт (по таблице Шпицера)</div>

    <div class="input-group">
        <label>Сумма кредита (₪)</label>
        <input type="number" id="amount" value="50000" inputmode="numeric">
    </div>

    <div class="input-group">
        <label>Срок кредита (лет): <span id="yearsVal">5</span></label>
        <input type="range" id="years" min="1" max="30" value="5">
    </div>

    <div class="input-group">
        <!-- Прайм в Израиле меняется, здесь задаем базовое значение. Пользователь меняет только маржу -->
        <label>Ставка (Прайм ± %): <span id="rateVal">P + 1.5%</span></label>
        <div class="slider-value">
            <span>P - 2%</span>
            <span>P + 5%</span>
        </div>
        <input type="range" id="margin" min="-2" max="5" step="0.1" value="1.5">
        <div style="font-size: 12px; color: var(--tg-theme-hint-color, #999); margin-top: 5px;">
            *Текущий Прайм заложен как 6.0%. Итоговая ставка: <span id="finalRatePreview" style="font-weight:bold;">7.5%</span>
        </div>
    </div>

    <div class="results">
        <h3>Ежемесячный платеж</h3>
        <div class="main-result"><span id="monthlyPayment">1,001</span> ₪</div>
        <div class="details">
            <div>
                <div>Всего процентов</div>
                <strong id="totalInterest">10,085 ₪</strong>
            </div>
            <div>
                <div>Общая выплата</div>
                <strong id="totalPayment">60,085 ₪</strong>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand(); // Разворачиваем на весь экран

        // Базовая ставка Прайм (можно обновлять в коде при изменениях Банка Израиля)
        const PRIME_RATE = 6.0;

        const inputs = ['amount', 'years', 'margin'];
        inputs.forEach(id => document.getElementById(id).addEventListener('input', calculate));

        function calculate() {
            const P = parseFloat(document.getElementById('amount').value) || 0;
            const years = parseFloat(document.getElementById('years').value);
            const margin = parseFloat(document.getElementById('margin').value);
            
            document.getElementById('yearsVal').innerText = years;
            document.getElementById('rateVal').innerText = `P ${margin >= 0 ? '+' : ''} ${margin}%`;
            
            const finalRate = PRIME_RATE + margin;
            document.getElementById('finalRatePreview').innerText = finalRate.toFixed(1) + '%';

            if (P > 0 && years > 0 && finalRate > 0) {
                const r = (finalRate / 100) / 12; // месячная ставка
                const n = years * 12; // количество месяцев
                
                // Формула Шпицера (аннуитетный платеж)
                const monthly = P * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                const total = monthly * n;
                const interest = total - P;

                document.getElementById('monthlyPayment').innerText = Math.round(monthly).toLocaleString();
                document.getElementById('totalPayment').innerText = Math.round(total).toLocaleString() + ' ₪';
                document.getElementById('totalInterest').innerText = Math.round(interest).toLocaleString() + ' ₪';
            } else {
                document.getElementById('monthlyPayment').innerText = "0";
                document.getElementById('totalPayment').innerText = "0 ₪";
                document.getElementById('totalInterest').innerText = "0 ₪";
            }
        }

        // Первичный расчет при загрузке
        calculate();
    </script>
</body>
</html>
