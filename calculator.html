<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансовый калькулятор</title>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --primary: #007aff;
            --primary-hover: #0056b3;
            --input-bg: #f5f5f7;
            --border: #e5e5ea;
        }

        body.dark-theme {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-main: #f5f5f7;
            --text-muted: #98989d;
            --input-bg: #2c2c2e;
            --border: #38383a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background-color 0.3s;
        }

        .calculator-container {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 24px;
            max-width: 450px;
            margin: 0 auto;
        }

        .tabs {
            display: flex;
            background-color: var(--input-bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-muted);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .tab.active {
            background-color: var(--card-bg);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .calculator-section {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .calculator-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background-color: var(--input-bg);
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }

        .term-group {
            display: flex;
            gap: 12px;
        }

        .term-group > div {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(0, 122, 255, 0.2);
        }

        .results {
            margin-top: 24px;
            padding: 20px;
            background-color: var(--input-bg);
            border-radius: 16px;
            display: none;
            border: 1px solid var(--border);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 15px;
            color: var(--text-muted);
        }

        .result-item span:last-child {
            color: var(--text-main);
            font-weight: 600;
        }

        .result-item.total {
            margin-bottom: 0;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            font-size: 18px;
            color: var(--text-main);
            font-weight: 700;
        }

        .result-item.total span:last-child {
            color: var(--primary);
        }

        .note {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('loan')">Кредит</div>
            <div class="tab" onclick="switchTab('investment')">Инвестиции</div>
        </div>

        <!-- КРЕДИТНЫЙ КАЛЬКУЛЯТОР -->
        <div id="loan-calc" class="calculator-section active">
            <div class="input-group">
                <label>Сумма кредита (₪)</label>
                <input type="number" id="loan-amount" placeholder="Например, 100000">
            </div>
            <div class="input-group">
                <label>Процентная ставка (%)</label>
                <input type="number" id="loan-rate" step="0.1" value="4.75">
                <div class="note">Текущая ставка Прайм — 4.75%</div>
            </div>
            <div class="input-group term-group">
                <div>
                    <label>Срок (годы)</label>
                    <input type="number" id="loan-years" value="0" min="0">
                </div>
                <div>
                    <label>Срок (месяцы)</label>
                    <input type="number" id="loan-months" value="0" min="0">
                </div>
            </div>
            <button onclick="calculateLoan()">Рассчитать кредит</button>
            
            <div id="loan-results" class="results">
                <div class="result-item">
                    <span>Ежемесячный платеж:</span>
                    <span id="loan-monthly-payment">0 ₪</span>
                </div>
                <div class="result-item">
                    <span>Переплата по процентам:</span>
                    <span id="loan-total-interest">0 ₪</span>
                </div>
                <div class="result-item total">
                    <span>Общая сумма возврата:</span>
                    <span id="loan-total-payment">0 ₪</span>
                </div>
            </div>
        </div>

        <!-- ИНВЕСТИЦИОННЫЙ КАЛЬКУЛЯТОР -->
        <div id="investment-calc" class="calculator-section">
            <div class="input-group">
                <label>Начальная сумма (₪)</label>
                <input type="number" id="inv-initial" placeholder="Например, 10000">
            </div>
            <div class="input-group">
                <label>Ежемесячное пополнение (₪)</label>
                <input type="number" id="inv-monthly" placeholder="Например, 1000">
            </div>
            <div class="input-group">
                <label>Доходность в год (%)</label>
                <input type="number" id="inv-rate" step="0.1" value="7.0">
            </div>
            <div class="input-group term-group">
                <div>
                    <label>Срок (годы)</label>
                    <input type="number" id="inv-years" value="0" min="0">
                </div>
                <div>
                    <label>Срок (месяцы)</label>
                    <input type="number" id="inv-months" value="0" min="0">
                </div>
            </div>
            <button onclick="calculateInvestment()">Рассчитать прибыль</button>

            <div id="inv-results" class="results">
                <div class="result-item">
                    <span>Вложено всего:</span>
                    <span id="inv-total-invested">0 ₪</span>
                </div>
                <div class="result-item">
                    <span>Прибыль (проценты):</span>
                    <span id="inv-total-interest">0 ₪</span>
                </div>
                <div class="result-item total">
                    <span>Итоговая сумма:</span>
                    <span id="inv-total-balance">0 ₪</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        
        // Автоматическое включение темной темы, если она стоит в Telegram
        if (tg.colorScheme === 'dark') {
            document.body.classList.add('dark-theme');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.calculator-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.results').forEach(r => r.style.display = 'none');
            
            if (tab === 'loan') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loan-calc').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('investment-calc').classList.add('active');
            }
        }

        function calculateLoan() {
            const amount = parseFloat(document.getElementById('loan-amount').value) || 0;
            const annualRate = parseFloat(document.getElementById('loan-rate').value) || 0;
            const years = parseInt(document.getElementById('loan-years').value) || 0;
            const months = parseInt(document.getElementById('loan-months').value) || 0;

            const totalMonths = (years * 12) + months;
            
            if (amount <= 0 || totalMonths <= 0) {
                alert("Пожалуйста, введите корректную сумму и срок.");
                return;
            }

            const monthlyRate = (annualRate / 100) / 12;
            let monthlyPayment = 0;
            let totalPayment = 0;

            if (annualRate === 0) {
                monthlyPayment = amount / totalMonths;
                totalPayment = amount;
            } else {
                monthlyPayment = amount * (monthlyRate * Math.pow(1 + monthlyRate, totalMonths)) / (Math.pow(1 + monthlyRate, totalMonths) - 1);
                totalPayment = monthlyPayment * totalMonths;
            }

            const totalInterest = totalPayment - amount;

            document.getElementById('loan-monthly-payment').innerText = formatCurrency(monthlyPayment);
            document.getElementById('loan-total-interest').innerText = formatCurrency(totalInterest);
            document.getElementById('loan-total-payment').innerText = formatCurrency(totalPayment);
            document.getElementById('loan-results').style.display = 'block';
        }

        function calculateInvestment() {
            const initial = parseFloat(document.getElementById('inv-initial').value) || 0;
            const monthlyCont = parseFloat(document.getElementById('inv-monthly').value) || 0;
            const annualRate = parseFloat(document.getElementById('inv-rate').value) || 0;
            const years = parseInt(document.getElementById('inv-years').value) || 0;
            const months = parseInt(document.getElementById('inv-months').value) || 0;

            const totalMonths = (years * 12) + months;

            if (totalMonths <= 0) {
                alert("Пожалуйста, введите срок инвестирования.");
                return;
            }

            const monthlyRate = (annualRate / 100) / 12;
            let balance = initial;
            let totalInvested = initial + (monthlyCont * totalMonths);

            for (let i = 0; i < totalMonths; i++) {
                balance += monthlyCont;
                balance += balance * monthlyRate;
            }

            const totalInterest = balance - totalInvested;

            document.getElementById('inv-total-invested').innerText = formatCurrency(totalInvested);
            document.getElementById('inv-total-interest').innerText = formatCurrency(totalInterest);
            document.getElementById('inv-total-balance').innerText = formatCurrency(balance);
            document.getElementById('inv-results').style.display = 'block';
        }

        function formatCurrency(num) {
            return num.toLocaleString('he-IL', { maximumFractionDigits: 0 }) + ' ₪';
        }
    </script>
</body>
</html>
